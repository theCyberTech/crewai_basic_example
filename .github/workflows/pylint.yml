name: Validate CrewAI configuration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - name: Install CrewAI
        run: |
          uv tool install crewai
          crewai install
      - name: Validate CrewAI configuration
        run: |
          uv run python - <<'PY'
          from crewai.project.json_loader import validate_crew_project

          validate_crew_project("crew.jsonc")
          print("CrewAI project validation passed")
          PY
