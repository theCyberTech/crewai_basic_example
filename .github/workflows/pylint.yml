name: Validate CrewAI configuration

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON configuration
        run: |
          python -m json.tool crew.jsonc >/dev/null
          python -m json.tool agents/researcher.jsonc >/dev/null
