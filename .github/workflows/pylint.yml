name: Validate CrewAI project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate declarative crew configuration
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import json5

          crew = json5.loads(Path("crew.jsonc").read_text())
          agents = set(crew["agents"])
          assert agents
          assert crew["tasks"]

          for name in agents:
              config = Path("agents", f"{name}.jsonc")
              assert config.is_file(), f"Missing agent configuration: {config}"
              agent = json5.loads(config.read_text())
              for field in ("role", "goal", "backstory", "llm"):
                  assert agent.get(field), f"{config}: missing {field}"

          for task in crew["tasks"]:
              assert task["agent"] in agents, (
                  f'{task["name"]}: unknown agent {task["agent"]}'
              )
              assert task.get("description")
              assert task.get("expected_output")
          PY
